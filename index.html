<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX COIN - Official</title><link rel="icon" href="logo.png?v=logo2"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Inter,sans-serif} .hero{background:radial-gradient(ellipse at top,#0a1a12 0%,#000 70%);min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center} .logo-ring{width:180px;height:180px;border-radius:50%;background:#000;box-shadow:0 0 80px rgba(34,255,120,.4);animation:float 3s ease-in-out infinite;overflow:hidden;border:2px solid rgba(34,255,120,.3)} .logo-ring img{width:100%;height:100%;object-fit:cover} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}} .title{font-size:48px;font-weight:900;margin-top:20px;letter-spacing:3px;color:#2aff80} .bal-card{background:linear-gradient(135deg,#0a0a0a,#0f1a12);border:1px solid rgba(42,255,128,.25);border-radius:24px;padding:22px;width:100%;max-width:520px;margin-top:20px} .bal{font-size:42px;font-weight:900} .usdt{color:#2aff80;font-weight:800;font-size:18px} .btns{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px} .btn{padding:16px;border-radius:16px;border:none;font-weight:900} .btn-main{background:linear-gradient(135deg,#00c853,#2aff80);color:#000} .btn-sec{background:#111;border:1px solid rgba(42,255,128,.2);color:#2aff80} .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.9);border-top:1px solid rgba(42,255,128,.15);display:flex;justify-content:space-around;padding:10px 0} .nav button{background:none;border:none;color:#5a7a65;font-size:11px} .nav .active{color:#2aff80}</style></head><body>
<div class="hero">
<div class="logo-ring"><img src="logo.png?v=logo2" alt="QDEXX"></div>
<div class="title">QDEXX COIN</div>
<div style="color:#6b8a75;margin-top:6px;font-size:12px;letter-spacing:2px">FUTURE MINING • LIVE BLOCKCHAIN</div>
<div class="bal-card"><div style="font-size:10px;color:#5a7a65;letter-spacing:2px">YOUR BALANCE (SYNCED)</div><div class="bal"><span id="bal">5.1150</span> QDX</div><div class="usdt"><span id="usdt">0.0259</span> USDT • Swapped</div><div style="margin-top:10px;font-size:11px;color:#5a7a65" id="wallet">QDXA... YOU • SYNC #4115</div></div>

<div class="btns" style="margin-top:10px"><button class="btn btn-sec" onclick="location.href='wallet.html?v=logo2'">💳 WALLET</button><button class="btn btn-sec" onclick="location.href='swap.html?v=logo2'">📈 SWAP</button></div>
</div>
<div class="nav"><button class="active">🏠<br>Home</button><button onclick="location.href='mine.html?v=logo2'">⛏️<br>Mining</button><button onclick="location.href='explorer.html?v=logo2'">🔍<br>Explorer</button><button onclick="location.href='wallet.html?v=logo2'">💳<br>Wallet</button></div>
<script>
let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4115');let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.1150');let usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259');function render(){document.getElementById('bal').innerText=balance.toFixed(4);document.getElementById('usdt').innerText=usdt.toFixed(4);document.getElementById('wallet').innerText='SYNC #'+blocks+' • '+balance.toFixed(4)+' QDX + '+usdt.toFixed(4)+' USDT';}render();setInterval(()=>{let b=parseInt(localStorage.getItem('qdexx_blocks')||blocks);let bl=parseFloat(localStorage.getItem('qdexx_bal')||balance);let u=parseFloat(localStorage.getItem('qdexx_usdt')||usdt);if(b!==blocks||bl!==balance||u!==usdt){blocks=b;balance=bl;usdt=u;render();}else if(localStorage.getItem('qdexx_mining')!=='false'){blocks++;balance+=0.001;localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));render();}},1000);
