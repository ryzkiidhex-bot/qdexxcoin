<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX EXPLORER PRO SYNC</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#e5e7eb;font-family:Inter;padding:12px;padding-bottom:90px}.header{background:linear-gradient(135deg,#11111a,#1a1a2e);border:1px solid #23232f;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center} .logo{font-weight:900;font-size:22px} .logo b{color:#7c5cff} .live{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}} .badge-live{background:#0f2a1a;color:#22c55e;border:1px solid #1a4a2a;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;display:flex;gap:6px;align-items:center} .search-wrap{position:relative;margin:12px 0} .search{width:100%;background:#11111a;border:1px solid #2a2a3a;border-radius:16px;padding:16px 16px 16px 46px;color:#fff;outline:none;font-size:14px} .search:focus{border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.2)} .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%)} .card{background:#11111a;border:1px solid #1f1f2b;border-radius:20px;padding:16px;margin-bottom:14px} .grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px} .stat{background:#1a1a28;border-radius:16px;padding:14px;text-align:center;border:1px solid #23232f} .stat b{font-size:20px;display:block;color:#a78bfa;font-weight:900} .stat span{font-size:10px;color:#6b7280;text-transform:uppercase} .stat-green b{color:#22c55e} .table{width:100%;border-collapse:collapse;font-size:13px} .table td{padding:12px 8px;border-top:1px solid #1a1a24} .hash{color:#7c5cff;font-family:monospace;font-size:12px;font-weight:700} .reward{color:#22c55e;font-weight:800;text-align:right} .badge-you{background:#0f2a1a;color:#22c55e;border:1px solid #1a4a2a;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800} .detail{background:#0d0d14;border:1px solid #7c5cff;border-radius:16px;padding:14px;margin-top:12px;display:none} .nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f16;border-top:1px solid #23232f;display:flex;justify-content:space-around;padding:10px 0} .nav button{background:none;border:none;color:#6b7280;font-size:11px} .nav .active{color:#7c5cff}</style></head><body>
<div class="header"><div class="logo"><b>QDEXX</b> EXPLORER</div><div class="badge-live"><span class="live"></span><span id="liveHdr">LIVE AUTO • #4305</span></div></div>
<div class="search-wrap"><span class="search-icon">🔍</span><input id="searchBox" class="search" placeholder="🔍 Search block #4115, tx 0x..., wallet QDXA1B2..." oninput="doSearch(this.value)"></div>
<div class="card"><div class="grid4"><div class="stat"><b id="totalBlocks">4.305</b><span>Total Blocks</span></div><div class="stat"><b id="totalSupply">5.3050 QDX</b><span>Supply</span></div><div class="stat"><b>42,572 H/s</b><span>Hashrate</span></div><div class="stat stat-green"><b id="usdtStat">0.0259 USDT</b><span>Swapped</span></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>📦 Latest Blocks <span style="color:#22c55e;font-size:12px">• AUTO SYNC</span></h3><span class="badge-live" id="liveBadge">LIVE • #4305</span></div><table class="table"><tbody id="blockBody"></tbody></table></div>
<div id="detailCard" class="detail"><div style="font-weight:900;margin-bottom:8px;color:#a78bfa" id="detailTitle">Detail</div><div id="detailBody" style="font-size:13px;line-height:1.8;color:#9ca3af"></div><button onclick="document.getElementById('detailCard').style.display='none'" style="margin-top:10px;width:100%;padding:10px;border-radius:12px;border:1px solid #2a2a3a;background:#1a1a24;color:#fff;font-weight:800">Tutup</button></div>
<div class="nav"><button onclick="location.href='mine.html?v=sync'">⛏️<br>Mining</button><button class="active">🔍<br>Explorer</button><button onclick="location.href='wallet.html?v=sync'">💳<br>Wallet</button><button onclick="location.href='swap.html?v=sync'">📈<br>Swap</button></div>
<script>

let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4305');
let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.3050');
let usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259');
let wallet=localStorage.getItem('qdexx_wallet')||'QDXA1B2C3D4E5F6G7H8';
function save(){localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));localStorage.setItem('qdexx_usdt',usdt.toString());localStorage.setItem('qdexx_wallet',wallet);}
function shortW(w){return w.slice(0,6)+'...'+w.slice(-4);}

function randHash(){const c='abcdef0123456789';let h='0x';for(let i=0;i<12;i++)h+=c[Math.floor(Math.random()*16)];return h;}
let blockData=[];
function addBlock(h,isNew=false){const miner=(h%4===0)?wallet:'QDX'+Math.random().toString(36).slice(2,6).toUpperCase();blockData.unshift({height:h,hash:randHash()+Math.random().toString(16).slice(2,6)+'...'+Math.random().toString(16).slice(2,4),miner:miner,reward:'+0.001 QDX',ago:isNew?'0 secs ago':Math.floor(Math.random()*60)+' secs ago',txs:Math.floor(Math.random()*4)+1});if(blockData.length>12)blockData.pop();}
function init(){for(let i=11;i>=0;i--)addBlock(blocks-i);renderBlocks();}
function renderBlocks(){document.getElementById('totalBlocks').innerText=blocks.toLocaleString();document.getElementById('totalSupply').innerText=balance.toFixed(4)+' QDX';document.getElementById('usdtStat').innerText=usdt.toFixed(4)+' USDT';document.getElementById('liveBadge').innerText='LIVE • #'+blocks;document.getElementById('liveHdr').innerText='LIVE AUTO • #'+blocks+' • '+new Date().toLocaleTimeString().slice(0,5);document.getElementById('blockBody').innerHTML=blockData.map(b=>`<tr onclick="showBlock(${b.height})" style="cursor:pointer"><td><b>Block #${b.height}</b><br><span style="font-size:11px;color:#6b7280">${b.ago} • ${b.txs} txs</span></td><td><span class="hash">${b.hash}</span><br><span style="font-size:12px">${shortW(b.miner)} ${b.miner===wallet?'<span class="badge-you">YOU</span>':''}</span></td><td class="reward">+0.001<br>QDX<br><span style="font-size:10px;color:#6b7280">${b.txs} txs</span></td></tr>`).join('');}
function showBlock(h){document.getElementById('detailCard').style.display='block';document.getElementById('detailTitle').innerText='Block #'+h+' SYNCED';document.getElementById('detailBody').innerHTML=`Height: <b style="color:#fff">${h}</b><br>Balance: ${balance.toFixed(4)} QDX + ${usdt.toFixed(4)} USDT (same as wallet & chart)<br>Wallet: ${wallet}<br><br><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="location.href='mine.html?v=sync'" style="padding:10px;border-radius:10px;border:none;background:#7c5cff;color:#fff;font-weight:800">⛏️ Mining</button><button onclick="location.href='wallet.html?v=sync'" style="padding:10px;border-radius:10px;border:1px solid #2a2a3a;background:#1a1a24;color:#fff;font-weight:800">💳 Wallet</button></div>`;}
function doSearch(v){if(!v||v.length<2){document.getElementById('detailCard').style.display='none';return;}v=v.trim();document.getElementById('detailCard').style.display='block';if(v.startsWith('QDX')){document.getElementById('detailTitle').innerText='Wallet: '+v;document.getElementById('detailBody').innerHTML=`Address: <span class="hash">${v}</span><br>Balance: ${balance.toFixed(4)} QDX + ${usdt.toFixed(4)} USDT<br>Synced: mining, wallet, chart all same`;}else{let h=isNaN(v)?blocks:parseInt(v);showBlock(h);}}
setInterval(()=>{let isMining=localStorage.getItem('qdexx_mining')!=='false';let b2=parseInt(localStorage.getItem('qdexx_blocks')||blocks);let bl=parseFloat(localStorage.getItem('qdexx_bal')||balance);let u=parseFloat(localStorage.getItem('qdexx_usdt')||usdt); if(b2>blocks||bl!==balance||u!==usdt){if(b2>blocks)for(let k=blocks+1;k<=b2;k++)addBlock(k,true);blocks=b2;balance=bl;usdt=u;}else if(isMining){blocks++;balance+=0.001;localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));addBlock(blocks,true);}blockData.forEach((b,i)=>{b.ago=i===0?'0 secs ago':i*2+' secs ago';});renderBlocks();},1000);
init();
</script></body></html>
