<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>QDEXX Explorer</title><style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:14px}.card{background:#15151e;border:1px solid #23232f;border-radius:18px;padding:16px;margin:12px 0}.hash{color:#7c5cff;font-family:monospace}</style></head><body>
<h2><b style=color:#7c5cff>QDEXX</b> EXPLORER LIVE</h2>
<div class=card>Blocks: <b id=b>3794</b> | Balance: <b id=bal>4.7940 QDX</b><br>Hash: <span class=hash id=h>0x... </span></div>
<div class=card id=list></div>
<div class=card><button onclick="location.href='mine.html?v=pi24'" style=width:100%;padding:14px;border-radius:14px;background:#7c5cff;color:#fff;border:none;font-weight:800>← Balik Mining</button></div>
<script>
let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'3794');let bal=parseFloat(localStorage.getItem('qdexx_bal')||'4.7940');function rh(){return '0x'+Math.random().toString(16).slice(2,6)+'...'+Math.random().toString(16).slice(2,6)}
function render(){document.getElementById('b').innerText=blocks;document.getElementById('bal').innerText=bal.toFixed(4)+' QDX';document.getElementById('h').innerText=rh();let h='';for(let i=0;i<8;i++)h+=`#${blocks-i} <span class=hash>${rh()}</span> +0.001 QDX<br>`;document.getElementById('list').innerHTML=h}
render();setInterval(()=>{let b=parseInt(localStorage.getItem('qdexx_blocks')||blocks+'');if(b>blocks){blocks=b;render()}},1000)
</script></body></html>
