<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX EXPLORER AUTO</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#e5e7eb;font-family:Inter,sans-serif;padding:14px;padding-bottom:100px}.header{background:#11111a;border:1px solid #23232f;border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.logo b{color:#7c5cff}.card{background:#15151e;border:1px solid #23232f;border-radius:18px;padding:16px;margin-bottom:14px;margin-top:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#1c1c28;border-radius:14px;padding:12px;text-align:center;border:1px solid #2a2a3a}.stat b{font-size:18px;display:block;color:#a78bfa}.stat span{font-size:11px;color:#9ca3af}.table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.table th{text-align:left;color:#6b7280;padding:8px;font-size:11px}.table td{padding:10px 8px;border-top:1px solid #1f1f2b}.hash{color:#7c5cff;font-family:monospace;font-size:12px}.badge{border-radius:999px;padding:4px 10px;font-size:11px}.badge-green{background:#0f2a1a;color:#22c55e;border:1px solid #1a4a2a}.live{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}</style></head><body>
<div class="header"><div class="logo"><b>QDEXX</b> EXPLORER <span class="live"></span></div><div style="font-size:11px;color:#22c55e" id="liveTxt">LIVE AUTO • MAINNET</div></div>
<div class="card"><div class="grid2"><div class="stat"><b id="totalBlocks">0</b><span>TOTAL BLOCKS</span></div><div class="stat"><b id="totalSupply">0</b><span>SUPPLY</span></div><div class="stat"><b id="hashrate">42,572 H/s</b><span>HASHRATE</span></div><div class="stat"><b id="usdtTxt" style="color:#22c55e">0.0259 USDT</b><span>SWAPPED</span></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><div style="font-weight:800">Latest Blocks <span id="autoDot" style="font-size:11px;color:#22c55e">● AUTO</span></div><div class="badge badge-green" id="liveBadge">syncing...</div></div><table class="table"><tbody id="blockBody"></tbody></table></div>
<script>
let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4113');let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.1130');let myWallet=localStorage.getItem('qdexx_wallet')||'QDXA1B...G7H8';
function randHash(){const c='abcdef0123456789';let h='0x';for(let i=0;i<12;i++)h+=c[Math.floor(Math.random()*16)];return h+'...'+c[Math.floor(Math.random()*16)]+c[Math.floor(Math.random()*16)];}
function shortW(w){return w.slice(0,6)+'...'+w.slice(-4);}
let blockData=[];
function addBlock(h){blockData.unshift({height:h,hash:randHash(),miner:h%3===0?myWallet:'QDX'+Math.random().toString(36).slice(2,6).toUpperCase(),reward:'+0.001 QDX',ago:'0 secs ago',txs:Math.floor(Math.random()*5)+1});if(blockData.length>15)blockData.pop();}
function init(){for(let i=12;i>=0;i--)addBlock(blocks-i);render();}
function render(){document.getElementById('totalBlocks').innerText=blocks.toLocaleString();document.getElementById('totalSupply').innerText=balance.toFixed(4)+' QDX';document.getElementById('blockBody').innerHTML=blockData.map(b=>`<tr><td><b>Block #${b.height}</b><br><span style="font-size:11px;color:#6b7280">${b.ago} • ${b.txs} txs</span></td><td><span class="hash">${b.hash}</span><br>${shortW(b.miner)} ${b.miner===myWallet?'<span class="badge badge-green">YOU</span>':''}</td><td style="color:#22c55e;text-align:right">${b.reward}<br><span style="font-size:11px;color:#6b7280">${b.txs} txs</span></td></tr>`).join('');document.getElementById('liveBadge').innerText='LIVE • #'+blocks;document.getElementById('liveTxt').innerText='LIVE AUTO • #'+blocks+' • '+new Date().toLocaleTimeString();}
// AUTO INCREMENT TANPA REFRESH
setInterval(()=>{
  let isMining=localStorage.getItem('qdexx_mining')!=='false';
  // baca dari mine.html
  let b2=parseInt(localStorage.getItem('qdexx_blocks')||blocks.toString());
  if(b2>blocks){ // ada mining di tab lain
    for(let k=blocks+1;k<=b2;k++)addBlock(k);
    blocks=b2; balance=parseFloat(localStorage.getItem('qdexx_bal')||balance.toString());
  }else if(isMining){
    // kalau tab ini aja yang mining, auto +1 tiap 2 detik
    blocks++; balance+=0.001;
    localStorage.setItem('qdexx_blocks',blocks.toString());
    localStorage.setItem('qdexx_bal',balance.toString());
    addBlock(blocks);
  }
  // update ago counter
  blockData.forEach((b,i)=>{b.ago=(i*2)+' secs ago';});
  render();
},1000);
// dengar storage event biar antar tab sinkron tanpa refresh
window.addEventListener('storage',(e)=>{
  if(e.key==='qdexx_blocks'){let nb=parseInt(e.newValue); if(nb>blocks){for(let k=blocks+1;k<=nb;k++)addBlock(k); blocks=nb; render();}}
});
init(); render();
</script></body></html>
