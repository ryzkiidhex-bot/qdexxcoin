<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX SWAP CHART SYNC</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Inter;padding:14px;padding-bottom:90px}.header{background:linear-gradient(135deg,#11111a,#1a1a2e);border:1px solid #23232f;border-radius:20px;padding:16px;display:flex;justify-content:space-between} .logo b{color:#7c5cff} .card{background:#11111a;border:1px solid #1f1f2b;border-radius:20px;padding:16px;margin-top:14px} .chart{height:180px;background:linear-gradient(180deg,#1a1a2e,#11111a);border-radius:14px;display:flex;align-items:end;gap:4px;padding:10px;margin-top:12px} .bar{flex:1;background:linear-gradient(180deg,#7c5cff,#22c55e);border-radius:4px} .btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;margin-top:10px} .nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f16;border-top:1px solid #23232f;display:flex;justify-content:space-around;padding:10px 0} .nav button{background:none;border:none;color:#6b7280;font-size:11px} .nav .active{color:#7c5cff}</style></head><body>
<div class="header"><div class="logo"><b>QDEXX</b> CHART</div><div style="color:#22c55e;font-size:11px" id="live">SYNC #4305 • $0.0042</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><span>QDEXX/USDT</span><span style="color:#22c55e">+12.3%</span></div><div style="font-size:28px;font-weight:900">$0.0042</div><div class="chart" id="chart"></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:6px"><span>Supply: <b id="sup" style="color:#fff">5.3050</b> QDX</span><span>USDT: <b id="usdt" style="color:#22c55e">0.0259</b></span></div></div>
<div class="card"><b>Swap QDX → USDT</b><div style="background:#1a1a24;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between"><span>QDX</span><input id="qdxIn" value="4.1550" style="background:none;border:none;color:#fff;text-align:right;width:100px" oninput="calc()"></div><div style="text-align:center;margin:8px">⬇️</div><div style="background:#0f2a1a;border:1px solid #1a4a2a;border-radius:12px;padding:12px;display:flex;justify-content:space-between"><span>USDT</span><b id="usdtOut" style="color:#22c55e">0.0259</b></div><button class="btn" style="background:#22c55e;color:#fff" onclick="doSwap()">🔄 Swap berhasil! (foto 14:36)</button><div style="font-size:11px;color:#6b7280;margin-top:8px;text-align:center">Balance: <span id="bal">5.3050</span> QDX • Synced with Wallet & Explorer</div></div>
<div class="nav"><button onclick="location.href='mine.html?v=sync'">⛏️<br>Mining</button><button onclick="location.href='explorer.html?v=sync'">🔍<br>Explorer</button><button onclick="location.href='wallet.html?v=sync'">💳<br>Wallet</button><button class="active">📈<br>Swap</button></div>
<script>

let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4305');
let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.3050');
let usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259');
let wallet=localStorage.getItem('qdexx_wallet')||'QDXA1B2C3D4E5F6G7H8';
function save(){localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));localStorage.setItem('qdexx_usdt',usdt.toString());localStorage.setItem('qdexx_wallet',wallet);}
function shortW(w){return w.slice(0,6)+'...'+w.slice(-4);}

function renderChart(){let c=document.getElementById('chart');c.innerHTML='';for(let i=0;i<20;i++){let h=20+Math.random()*100;let d=document.createElement('div');d.className='bar';d.style.height=h+'px';c.appendChild(d);}}
function render(){document.getElementById('bal').innerText=balance.toFixed(4);document.getElementById('sup').innerText=balance.toFixed(4);document.getElementById('usdt').innerText=usdt.toFixed(4);document.getElementById('live').innerText='SYNC #'+blocks+' • $0.0042';}
function calc(){let q=parseFloat(document.getElementById('qdxIn').value||0);let u=q*0.00625;document.getElementById('usdtOut').innerText=u.toFixed(4);}
function doSwap(){let q=parseFloat(document.getElementById('qdxIn').value||0);if(q>balance){alert('Balance kurang!');return;}balance-=q;usdt+=q*0.00625;save();render();alert('Swap berhasil! '+q+' QDX → '+(q*0.00625).toFixed(4)+' USDT (foto 14:36)');}
renderChart();render();calc();
setInterval(()=>{let b=parseInt(localStorage.getItem('qdexx_blocks')||blocks);let bl=parseFloat(localStorage.getItem('qdexx_bal')||balance);let u=parseFloat(localStorage.getItem('qdexx_usdt')||usdt); if(b!==blocks||bl!==balance||u!==usdt){blocks=b;balance=bl;usdt=u;render();}},500);
</script></body></html>
