<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QDEXX WALLET</title><style>body{background:#0a0a0a;color:#fff;font-family:monospace;padding:20px;text-align:center}.card{background:#111;border:1px solid #00ff88;border-radius:12px;padding:20px;max-width:600px;margin:20px auto}input{padding:12px;width:90%;background:#000;color:#0f8;border:1px solid #0f8;border-radius:8px}button{padding:10px 20px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;margin:5px}</style></head><body>
<h1 style="color:#00ff88">QDEXX WALLET</h1>
<div class="card"><input id="addr" placeholder="QDX..."><br><br><button onclick="check()">CHECK BALANCE</button><button onclick="gen()">GENERATE NEW</button><div id="bal" style="font-size:32px;color:#00ff88;margin:20px"></div><div id="list" style="text-align:left;word-break:break-all"></div></div>
<script>
function gen(){let a='QDX'+[...Array(32)].map(()=>Math.floor(Math.random()*16).toString(16)).join('').toUpperCase();document.getElementById('addr').value=a;localStorage.my_wallet=a;check()}
async function check(){let addr=document.getElementById('addr').value.trim();if(!addr)return;document.getElementById('bal').innerText='Loading...';let r=await fetch('qdexx_chain.json');let chain=await r.json();chain=Array.isArray(chain)?chain:chain.chain||[];let bal=0,txs=[];chain.forEach(b=>{if(b.miner==='ryzkii_brc'&&b.transaction?.from===addr)bal-=b.transaction.amount;if(b.transaction?.to===addr){bal+=b.transaction.amount;txs.push(b)}if(b.miner==='ryzkii_brc'&&addr==='QDX4F37B68A5C7FF70AF7F6CE1C746B4F6259E')bal+=0.5});if(addr==='QDX4F37B68A5C7FF70AF7F6CE1C746B4F6259E')bal+=50;document.getElementById('bal').innerText=bal.toFixed(1)+' QDX';document.getElementById('list').innerHTML=txs.slice(-20).reverse().map(b=>`#${b.index} +${b.transaction.amount} from ${b.transaction.from.slice(0,8)}...<br>`).join('')||'No tx yet. Claim at faucet.html'}
if(localStorage.my_wallet)document.getElementById('addr').value=localStorage.my_wallet;
</script>
<p><a href="./" style="color:#0f8">Explorer</a> | <a href="faucet.html" style="color:#0f8">Faucet</a></p>
</body></html>
