<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX WALLET SYNC</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Inter;padding:14px;padding-bottom:90px}.header{background:linear-gradient(135deg,#11111a,#1a1a2e);border:1px solid #23232f;border-radius:20px;padding:16px;display:flex;justify-content:space-between} .logo b{color:#7c5cff} .card{background:#11111a;border:1px solid #1f1f2b;border-radius:20px;padding:16px;margin-top:14px} .bal{font-size:36px;font-weight:900;text-align:center} .usdt{text-align:center;color:#22c55e;font-weight:800;font-size:20px} .btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;margin-top:10px} .nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f16;border-top:1px solid #23232f;display:flex;justify-content:space-around;padding:10px 0} .nav button{background:none;border:none;color:#6b7280;font-size:11px} .nav .active{color:#7c5cff}</style></head><body>
<div class="header"><div class="logo"><b>QDEXX</b> WALLET</div><div style="color:#22c55e;font-size:11px" id="live">SYNC #4305</div></div>
<div class="card"><div class="bal"><span id="bal">5.3050</span> QDX</div><div class="usdt"><span id="usdt">0.0259</span> USDT</div><div style="text-align:center;font-size:11px;color:#6b7280;margin-top:6px" id="wallet">QDXA1B2C3D4E5F6G7H8</div><div style="text-align:center;margin-top:10px"><span style="background:#0f2a1a;color:#22c55e;border:1px solid #1a4a2a;padding:4px 10px;border-radius:999px;font-size:11px">● SYNCED WITH MINING + EXPLORER</span></div></div>
<div class="card"><b>Assets</b><div style="margin-top:10px"><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a24"><span>QDX Balance</span><b style="color:#a78bfa" id="bal2">5.3050</b></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1a1a24"><span>USDT Swapped (from 4.1550 QDX)</span><b style="color:#22c55e" id="usdt2">0.0259</b></div><div style="display:flex;justify-content:space-between;padding:10px 0"><span>Total Blocks Mined</span><b id="blocks">4305</b></div></div><button class="btn" style="background:#7c5cff;color:#fff" onclick="location.href='mine.html?v=sync'">⛏️ Mining</button><button class="btn" style="background:#1a1a24;color:#fff;border:1px solid #333" onclick="location.href='explorer.html?v=sync'">🔍 Explorer #<span class="b2">4305</span></button></div>
<div class="nav"><button onclick="location.href='mine.html?v=sync'">⛏️<br>Mining</button><button onclick="location.href='explorer.html?v=sync'">🔍<br>Explorer</button><button class="active">💳<br>Wallet</button><button onclick="location.href='swap.html?v=sync'">📈<br>Swap</button></div>
<script>

let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4305');
let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.3050');
let usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259');
let wallet=localStorage.getItem('qdexx_wallet')||'QDXA1B2C3D4E5F6G7H8';
function save(){localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));localStorage.setItem('qdexx_usdt',usdt.toString());localStorage.setItem('qdexx_wallet',wallet);}
function shortW(w){return w.slice(0,6)+'...'+w.slice(-4);}

function render(){document.getElementById('bal').innerText=balance.toFixed(4);document.getElementById('bal2').innerText=balance.toFixed(4);document.getElementById('usdt').innerText=usdt.toFixed(4);document.getElementById('usdt2').innerText=usdt.toFixed(4);document.getElementById('blocks').innerText=blocks;document.getElementById('live').innerText='SYNC #'+blocks;document.querySelectorAll('.b2').forEach(e=>e.innerText=blocks);}
render();
setInterval(()=>{let b=parseInt(localStorage.getItem('qdexx_blocks')||blocks);let bl=parseFloat(localStorage.getItem('qdexx_bal')||balance);let u=parseFloat(localStorage.getItem('qdexx_usdt')||usdt); if(b!==blocks||bl!==balance||u!==usdt){blocks=b;balance=bl;usdt=u;render();}},500);
</script></body></html>
