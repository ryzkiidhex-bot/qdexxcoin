<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX MINING PRO SYNC</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Inter;padding:14px;padding-bottom:90px}.header{background:linear-gradient(135deg,#11111a,#1a1a2e);border:1px solid #23232f;border-radius:20px;padding:16px;display:flex;justify-content:space-between} .logo b{color:#7c5cff} .card{background:#11111a;border:1px solid #1f1f2b;border-radius:20px;padding:16px;margin-top:14px} .btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;cursor:pointer;margin-top:10px} .btn-mine{background:#7c5cff;color:#fff} .btn-stop{background:#1a1a24;color:#fff;border:1px solid #333} .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px} .s{background:#1a1a28;border-radius:14px;padding:12px;text-align:center;border:1px solid #23232f} .s b{display:block;color:#a78bfa;font-size:18px} .nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f16;border-top:1px solid #23232f;display:flex;justify-content:space-around;padding:10px 0} .nav button{background:none;border:none;color:#6b7280;font-size:11px} .nav .active{color:#7c5cff}</style></head><body>
<div class="header"><div class="logo"><b>QDEXX</b> MINING</div><div style="color:#22c55e;font-size:11px" id="live">● LIVE #4305</div></div>
<div class="card"><div style="font-size:32px;font-weight:900;text-align:center"><span id="bal">5.3050</span> QDX</div><div style="text-align:center;color:#22c55e"><span id="usdt">0.0259</span> USDT • <span id="wal">QDXA1B...</span></div><div class="stat"><div class="s"><b id="blocks">4305</b><span style="font-size:10px;color:#6b7280">BLOCKS</span></div><div class="s"><b>42,572 H/s</b><span style="font-size:10px;color:#6b7280">HASHRATE</span></div></div><button id="mineBtn" class="btn btn-mine" onclick="toggle()">⛏️ START MINING (1 block/sec)</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" style="background:#22c55e;color:#fff" onclick="location.href='swap.html?v=sync'">📈 Swap Chart</button><button class="btn" style="background:#1a1a24;border:1px solid #333;color:#fff" onclick="location.href='wallet.html?v=sync'">💳 Wallet</button></div></div>
<div class="card"><b>Latest Reward</b><div id="log" style="font-size:12px;color:#9ca3af;margin-top:8px">Mining ready...</div></div>
<div class="nav"><button onclick="location.href='mine.html?v=sync'" class="active">⛏️<br>Mining</button><button onclick="location.href='explorer.html?v=sync'">🔍<br>Explorer</button><button onclick="location.href='wallet.html?v=sync'">💳<br>Wallet</button><button onclick="location.href='swap.html?v=sync'">📈<br>Swap</button></div>
<script>

let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'4305');
let balance=parseFloat(localStorage.getItem('qdexx_bal')||'5.3050');
let usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259');
let wallet=localStorage.getItem('qdexx_wallet')||'QDXA1B2C3D4E5F6G7H8';
function save(){localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_bal',balance.toFixed(4));localStorage.setItem('qdexx_usdt',usdt.toString());localStorage.setItem('qdexx_wallet',wallet);}
function shortW(w){return w.slice(0,6)+'...'+w.slice(-4);}

let mining = localStorage.getItem('qdexx_mining')!=='false';
let iv=null;
function render(){document.getElementById('bal').innerText=balance.toFixed(4);document.getElementById('blocks').innerText=blocks;document.getElementById('usdt').innerText=usdt.toFixed(4);document.getElementById('wal').innerText=shortW(wallet);document.getElementById('live').innerText='● LIVE #'+blocks;}
function toggle(){mining=!mining;localStorage.setItem('qdexx_mining',mining.toString()); if(mining)start(); else stop();}
function start(){if(iv)clearInterval(iv); document.getElementById('mineBtn').innerText='⏸️ STOP MINING - Mining...'; document.getElementById('mineBtn').className='btn btn-stop'; localStorage.setItem('qdexx_mining','true'); iv=setInterval(()=>{blocks++;balance+=0.001;save();render();document.getElementById('log').innerHTML='Block #'+blocks+' mined +0.001 QDX<br>'+new Date().toLocaleTimeString();},1000);}
function stop(){if(iv)clearInterval(iv); document.getElementById('mineBtn').innerText='⛏️ START MINING (1 block/sec)'; document.getElementById('mineBtn').className='btn btn-mine'; localStorage.setItem('qdexx_mining','false');}
render(); if(mining)start();
window.addEventListener('storage',(e)=>{if(e.key==='qdexx_blocks'){blocks=parseInt(e.newValue);render();}});
</script></body></html>
