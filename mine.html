<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX Mining - PI24</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f0f13;color:#e5e7eb;font-family:Inter,sans-serif;padding:16px;padding-bottom:100px}.card{background:#1a1a20;border:1px solid #2a2a35;border-radius:20px;padding:18px;margin-bottom:16px}.badge{display:inline-flex;background:#2a2a3a;border-radius:999px;padding:8px 14px;font-size:13px;margin:6px;border:1px solid #333}.btn{width:100%;border:none;border-radius:16px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}.btn-stop{background:#7c5cff;color:white}.btn-start{background:#22c55e;color:white;animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e66}70%{box-shadow:0 0 0 12px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}.progress{height:14px;background:#11111a;border-radius:999px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#7c5cff,#a78bfa);border-radius:999px}.log{background:#0a0a0f;border-radius:16px;padding:12px;font-family:monospace;font-size:12px;max-height:200px;overflow:auto;border:1px solid #222}.kyc-pending{background:#3a2e00;color:#facc15;border:1px solid #a08100;border-radius:999px;padding:6px 14px;font-size:12px}.timer{font-weight:800;color:#a78bfa;font-size:14px;margin-top:8px}</style></head><body>
<div class=card><div style="font-size:18px;font-weight:800">🎁 Bonus Telegram</div><div style="margin-top:12px;line-height:1.8;color:#9ca3af;font-size:14px">Wallet: <span id="wallet" style="color:#e5e7eb">QDXA1B2C3D4E5F6G7H8</span><br>Bonus awal: <b style="color:#fff">1 QDX</b><br>Registered: <span id="reg">13/10/2026</span><br>Telegram ID: <span id="tgid">7417727328</span></div></div>
<div class=card><div style="font-size:20px;font-weight:800">2. Progress Migrasi</div><div class=progress><div id="progBar" style="width:3%"></div></div><div style="display:flex;justify-content:space-between"><div id="hariText">1 / 30 hari</div><div class=kyc-pending>KYC: pending</div></div><div class=timer id="timerSisa">Sisa sesi: 23j 59m</div></div>
<div class=card><div style="font-size:20px;font-weight:800">3. Mining</div><div style="margin-top:12px"><span class=badge>Balance: <b id="bal">4.7940 QDX</b></span><span class=badge>Blocks: <b id="blocks">3794</b></span><span class=badge>Hashrate: <b id="hash">44241 H/s</b></span></div>
<button id="btnMining" class="btn btn-stop" onclick="toggleMining()">⏸️ STOP MINING</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn" style="background:#1a1a24;border:1px solid #2a2a3a;color:#a78bfa" onclick="location.href='explorer.html?v=pi24'">🔍 EXPLORER</button><button class="btn" style="background:#1a1a24;border:1px solid #2a2a3a;color:#fff" onclick="location.href='explorer.html?v=pi24'">💳 Wallet</button>
    <button class="btn" style="background:#1a1a24;border:1px solid #2a2a3a;color:#22c55e" onclick="location.href='wallet.html?v=pi24'">📈 Chart + KYC</button></div>
<div class=card style="background:linear-gradient(135deg,#1a1a2e,#1e1a3a);border:1px solid #7c5cff55;margin-top:14px"><div style="display:flex;justify-content:space-between"><div style="font-weight:800">🌐 Block Explorer</div><div style="font-size:11px;color:#22c55e">● LIVE</div></div><div style="margin-top:8px;font-size:13px;color:#9ca3af">Block #<b id="expBlock" style="color:#fff">3794</b> • <span id="expTx" style="color:#a78bfa">live</span></div><button class="btn" style="background:#7c5cff" onclick="location.href='explorer.html?v=pi24'">Buka Explorer →</button></div>
<div id="msg" style="margin-top:10px;font-size:13px;color:#22c55e;text-align:center"></div><div class=log id=log style="margin-top:12px"></div></div>
<script>
const SESSION=24*60*60*1000;let balance=parseFloat(localStorage.getItem('qdexx_bal')||'4.7940');let blocks=parseInt(localStorage.getItem('qdexx_blocks')||'3794');let isMining=localStorage.getItem('qdexx_mining')!=='false';let startTime=parseInt(localStorage.getItem('qdexx_start')||Date.now().toString());
function save(){localStorage.setItem('qdexx_bal',balance.toString());localStorage.setItem('qdexx_blocks',blocks.toString());localStorage.setItem('qdexx_mining',isMining.toString());localStorage.setItem('qdexx_start',startTime.toString());localStorage.setItem('qdexx_last',Date.now().toString())}
function toggleMining(){if(isMining){isMining=false;save();updateUI()}else{isMining=true;startTime=Date.now();save();updateUI()}}
function updateUI(){document.getElementById('bal').innerText=balance.toFixed(4)+" QDX";document.getElementById('blocks').innerText=blocks;document.getElementById('hash').innerText=Math.floor(40000+Math.random()*10000)+" H/s";try{document.getElementById('expBlock').innerText=blocks}catch{}let elapsed=Date.now()-startTime;let left=SESSION-elapsed;let days=parseInt(localStorage.getItem('qdexx_days')||'1');if(!isMining||left<=0){document.getElementById('btnMining').innerText="⛏️ MULAI MINING LAGI";document.getElementById('btnMining').className="btn btn-start";document.getElementById('timerSisa').innerText="Sesi habis - klik MULAI lagi"}else{document.getElementById('btnMining').innerHTML="⏸️ STOP MINING";document.getElementById('btnMining').className="btn btn-stop";let h=Math.floor(left/3600000);let m=Math.floor((left%3600000)/60000);let s=Math.floor((left%60000)/1000);document.getElementById('timerSisa').innerText=`Sisa sesi: ${h}j ${m}m ${s}d - Hari ${days}/30`}}
function addLog(t){let log=document.getElementById('log');log.innerHTML=new Date().toLocaleTimeString()+" "+t+"<br>"+log.innerHTML}
setInterval(()=>{if(isMining){balance+=0.001;blocks++;save();updateUI()}},1000);updateUI();save();
</script></body></html>
