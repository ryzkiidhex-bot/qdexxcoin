<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QDEXX MINING SYNC</title><style>body{background:#07070b;color:#fff;font-family:Inter;padding:14px} .card{background:#11111a;border:1px solid #1f1f2b;border-radius:20px;padding:16px;margin-top:14px} .btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;margin-top:10px}</style></head><body><div id="out"></div><script>let b=parseInt(localStorage.getItem('qdexx_blocks')||'4115'),bal=parseFloat(localStorage.getItem('qdexx_bal')||'5.1150'),usdt=parseFloat(localStorage.getItem('qdexx_usdt')||'0.0259'),w=localStorage.getItem('qdexx_wallet')||'QDXA1B2C3D4E5F6G7H8',min=localStorage.getItem('qdexx_mining')!=='false',iv=null;function save(){localStorage.setItem('qdexx_blocks',b);localStorage.setItem('qdexx_bal',bal.toFixed(4));localStorage.setItem('qdexx_usdt',usdt)}function render(){document.getElementById('out').innerHTML=`<div class=card><h2>QDEXX MINING LIVE #${b}</h2><div style="font-size:32px;font-weight:900">${bal.toFixed(4)} QDX</div><div style="color:#22c55e">${usdt} USDT • ${w.slice(0,6)}...${w.slice(-4)}</div><button class=btn style="background:#7c5cff;color:#fff" onclick="min=!min;localStorage.setItem('qdexx_mining',min);if(min)start();else stop();this.innerText=min?'STOP':'START'">${min?'STOP MINING':'START MINING'}</button><br><button class=btn style="background:#1a1a24;color:#fff" onclick="location.href='explorer.html?v=sync'">Explorer</button><button class=btn style="background:#1a1a24;color:#fff" onclick="location.href='wallet.html?v=sync'">Wallet</button><button class=btn style="background:#22c55e;color:#fff" onclick="location.href='swap.html?v=sync'">Swap Chart</button></div>`}function start(){iv=setInterval(()=>{b++;bal+=0.001;save();render()},1000)}function stop(){clearInterval(iv)}render();if(min)start();</script></body></html>
